<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Pokémon TCG Simulator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
      color: white;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      padding: 20px;
      text-align: center;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    h1 {
      font-size: 2rem;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 20px;
    }

    .section {
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .pack-select {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pack-btn {
      background: #222;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.2);
      transition: 0.2s;
    }

    .pack-btn:hover {
      background: #333;
      transform: translateY(-3px);
    }

    .cards {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      margin-top: 20px;
    }

    .card {
      width: 150px;
      height: 210px;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 15px rgba(0,0,0,0.5);
      transition: 0.2s;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    .money {
      font-size: 1.2rem;
      margin-bottom: 10px;
    }

    .secret-input {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: none;
      margin-top: 10px;
      background: rgba(255,255,255,0.1);
      color: white;
    }
  </style>
</head>

<body>
  <header>
    <h1>Pokémon TCG Pack Simulator</h1>
    <p>Real cards • Real images • Real prices • Simple & clean</p>
  </header>

  <div class="container">

    <!-- MONEY + DAILY REWARD -->
    <div class="section">
      <div class="money">💰 Money: <span id="money">$300</span></div>
      <button onclick="claimDaily()">Claim Daily Reward (+$50)</button>
    </div>

    <!-- PACK SELECTOR -->
    <div class="section">
      <h2>Select a Pack</h2>
      <div class="pack-select">
        <div class="pack-btn" onclick="openPack('base')">Base Set</div>
        <div class="pack-btn" onclick="openPack('jungle')">Jungle</div>
        <div class="pack-btn" onclick="openPack('fossil')">Fossil</div>
        <div class="pack-btn" onclick="openPack('sv')">Scarlet & Violet</div>
      </div>
    </div>

    <!-- SECRET CODES -->
    <div class="section">
      <h2>Secret Codes</h2>
      <input class="secret-input" id="secret" placeholder="Enter code..." onkeydown="checkSecret(event)">
    </div>

    <!-- CARD RESULTS -->
    <div class="section">
      <h2>Cards Pulled</h2>
      <div id="cards" class="cards"></div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
